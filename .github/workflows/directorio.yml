name: Directorio

# Cada día (y a mano: Actions -> Directorio -> Run workflow, o una sesión con
# actions_run_trigger) lee la ficha pública de cada plugin en
# community.obsidian.md: qué versión sirve el directorio y qué dijo su revisión
# automática. Escribe ESTADO.md y lo sube a main si cambió.
#
# Las sesiones de Claude no llegan a community.obsidian.md; GitHub Actions sí,
# y la ficha no pide login. La columna «Qué hacer» dice cuándo hay que pulsar
# Check for new releases en el dashboard, que es lo único que no se puede
# hacer desde aquí.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'directory/**'
      - '.github/workflows/directorio.yml'

permissions:
  contents: read

concurrency:
  group: directorio
  cancel-in-progress: false

jobs:
  estado:
    name: Estado en el directorio
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: node --test directory/*.test.mjs

      - name: Leer las fichas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node directory/estado.mjs --write

      - name: Commit a main
        if: github.event_name != 'pull_request'
        env:
          RAMA: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$(git status --porcelain -- ESTADO.md)" ]; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ESTADO.md
          git commit -q -m "Directorio: $(date -u +%F)" \
            -m 'Generado por .github/workflows/directorio.yml.'
          for intento in 1 2 3; do
            if git push origin "HEAD:$RAMA"; then exit 0; fi
            git pull -q --rebase origin "$RAMA"
          done
          echo "::error::No se pudo subir el commit a $RAMA."
          exit 1

  # Vigía independiente de las rutinas: si el autopilot deja de mandar el
  # informe, nadie corre status.mjs y nadie se entera (pasó del 15 al 25 de
  # octubre de 2026). Este job corre cada día con el cron de arriba y abre un
  # issue asignado al dueño cuando el último "Morning report" tiene más de 26 h.
  vigia:
    name: Vigía del informe diario
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Abrir un aviso si no hay informe en 26 h
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          ultimo=$(gh issue list --label morning-report --state all --limit 1 --json createdAt --jq '.[0].createdAt // empty')
          # Sin ninguno (etiqueta cambiada o nunca enviado) también es silencio.
          if [ -z "$ultimo" ]; then ultimo=never; horas=999; else
            horas=$(( ( $(date -u +%s) - $(date -u -d "$ultimo" +%s) ) / 3600 )); fi
          echo "Último informe: $ultimo (hace $horas h)."
          if [ "$horas" -le 26 ]; then
            # Vuelve a haber informe: se cierra el aviso, o el siguiente silencio no abriría otro.
            for n in $(gh issue list --label autopilot-silent --state open --json number --jq '.[].number'); do
              gh issue close "$n" --comment "A Morning report arrived ($ultimo); closing automatically."
            done
            exit 0
          fi
          gh label create autopilot-silent --color d93f0b --description "No morning report in over 26 h" --force
          if [ -n "$(gh issue list --label autopilot-silent --state open --json number --jq '.[].number')" ]; then
            echo "Ya hay un aviso abierto."; exit 0
          fi
          printf 'The last Morning report issue was opened %s (%s h ago). The autopilot routines may be disabled or failing: check them in the project, then close this issue.\n\n@%s\n' "$ultimo" "$horas" "$OWNER" > body.md
          gh issue create --title "Autopilot silent: no Morning report since ${ultimo%%T*}" --label autopilot-silent --assignee "$OWNER" --body-file body.md
