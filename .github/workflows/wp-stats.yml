name: WordPress stats

# Daily (and on dispatch) reads each WordPress plugin in wordpress/plugins.json
# from api.wordpress.org and its support feed, then commits wordpress/STATS.md
# and wordpress/history.csv to main if they changed. Claude sessions cannot
# reach api.wordpress.org; GitHub Actions can. The WordPress project's morning
# report reads these files.

on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'wordpress/**'
      - '.github/workflows/wp-stats.yml'

permissions:
  contents: read

concurrency:
  group: wp-stats
  cancel-in-progress: false

jobs:
  stats:
    name: Read wordpress.org
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: node --test wordpress/*.test.mjs

      - name: Read the plugins
        run: node wordpress/stats.mjs --write >> "$GITHUB_STEP_SUMMARY"

      - name: Commit to main
        if: github.event_name != 'pull_request'
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$(git status --porcelain -- wordpress)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wordpress/STATS.md wordpress/history.csv
          git commit -q -m "WordPress stats: $(date -u +%F)" \
            -m 'Generated by .github/workflows/wp-stats.yml.'
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            git pull -q --rebase origin "$BRANCH"
          done
          echo "::error::Could not push to $BRANCH."
          exit 1
